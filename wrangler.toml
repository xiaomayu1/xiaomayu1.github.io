name = "ink-pub"
main = "workers/index.js"
compatibility_date = "2024-11-01"
node_compat = true

[vars]
NODE_ENV = "production"

# ── D1 数据库绑定 ──
# 部署后在 Cloudflare Dashboard → Workers → ink-pub → Settings → D1 数据库中
# 绑定 ink-pub-db 到此 Worker
[d1_databases]
binding = "DB"
database_name = "ink-pub-db"
database_id = "YOUR_D1_DATABASE_ID"
